# Consome os eventos da Saga (fila billing-service no RabbitMQ).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service-consumer
  namespace: default
  labels:
    app: billing-service-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service-consumer
  template:
    metadata:
      labels:
        app: billing-service-consumer
    spec:
      # O pod não fala com a API do Kubernetes; sem token da service account montado.
      automountServiceAccountToken: false
      containers:
        - name: consumer
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command: ["bin/consumer"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Toda a configuração vem do ConfigMap e do Secret deste serviço (o Secret é criado pelo cd_deploy.yml).
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secrets
